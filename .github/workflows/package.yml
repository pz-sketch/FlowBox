name: Package FlowBox

# 手动触发:Actions → Package FlowBox → Run workflow → 选分支 → Run
# 产物为 ad-hoc 签名 DMG,仅供冒烟验证,不可对外分发
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Build DMG via dist.sh (ad-hoc signed, for smoke testing only)
        run: ./dist.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowBox-manual-${{ github.run_number }}
          path: dist/FlowBox.dmg
          retention-days: 14
