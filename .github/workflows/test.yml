name: Test FlowBox

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Build (release)
        run: swift build -c release

  test-runner:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Run FlowBoxTestRunner (67 checks, exit 1 on failure)
        run: swift run FlowBoxTestRunner

  swift-test:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Run swift test (best effort, swift-testing needs recent toolchain)
        run: swift test

  package:
    runs-on: macos-14
    needs: [build, test-runner]
    if: github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Build DMG via dist.sh (ad-hoc signed, for smoke testing only)
        run: ./dist.sh
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowBox-${{ github.sha }}
          path: dist/FlowBox.dmg
          retention-days: 14
