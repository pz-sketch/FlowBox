name: Test FlowBox

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Build (release)
        run: swift build -c release

  test-runner:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Run FlowBoxTestRunner (67 checks, exit 1 on failure)
        run: swift run FlowBoxTestRunner

  swift-test:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
      - name: Run swift test (best effort, swift-testing needs recent toolchain)
        run: swift test
